<style>
/* ═══ Painel (Etapa 4) ═══ */
.painel-ola{font-size:26px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.painel-data{font-size:12.5px;color:var(--muted)}
.painel-secao{margin-bottom:22px}
.painel-secao > h3{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px;margin:0 0 10px}
.painel-secao > h3 .qtd{background:var(--gold);color:var(--navy);border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:800}

.aguardo{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.aguardo-item{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--bg2);cursor:pointer;transition:background .12s;min-height:60px}
.aguardo-item:last-child{border-bottom:none}
.aguardo-item:hover{background:var(--bg)}
.aguardo-item:focus-visible{outline:3px solid rgba(40,168,232,.45);outline-offset:-3px}
.aguardo-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aguardo-ico .ico{font-size:20px}
.aguardo-txt{flex:1;min-width:0}
.aguardo-txt b{display:block;color:var(--navy);font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aguardo-txt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aguardo-quando{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;padding:3px 9px;border-radius:10px;background:var(--bg2)}
.aguardo-quando.vencido{background:var(--danger-bg);color:var(--danger)}
.aguardo-vazio{display:flex;align-items:center;gap:12px;padding:18px;color:var(--txt)}
.aguardo-vazio .ico{color:var(--ok);font-size:26px}
.aguardo-mais{display:block;width:100%;padding:11px;background:var(--bg);color:var(--teal-dark);font-weight:600;font-size:13px;min-height:44px}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-1);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .12s,transform .12s}
button.kpi:hover{border-color:var(--teal);transform:translateY(-1px)}
.kpi .k-rot{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-val{font-size:26px;font-weight:800;color:var(--navy);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-sub{font-size:11.5px;color:var(--muted);line-height:1.35}
.kpi.alerta .k-val{color:var(--danger)}
.kpi.atencao .k-val{color:#B45309}
.kpi.bom .k-val{color:var(--ok)}

.quadro-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.quadro-barra .busca{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #CBD5E1;border-radius:10px;padding:0 12px;min-height:42px;flex:1;min-width:200px;max-width:360px}
.quadro-barra .busca input{border:none!important;box-shadow:none!important;padding:9px 0!important}
.filtro-sit{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:10px}
.filtro-sit button{padding:7px 12px;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.filtro-sit button.ativo{background:#fff;color:var(--navy);box-shadow:var(--shadow-1)}
.filtro-sit .ponto{width:8px;height:8px;border-radius:50%}

.quadro{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;align-items:start}
.fase{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);min-width:0}
.fase > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;cursor:pointer;border-radius:var(--r-lg)}
.fase > summary::-webkit-details-marker{display:none}
.fase > summary .f-nome{font-weight:700;color:var(--navy);font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.fase > summary .f-num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fase > summary .f-qtd{background:#fff;border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.fase > summary .f-seta{display:none}
.fase-corpo{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.fase-vazia{font-size:12px;color:var(--muted);text-align:center;padding:14px 6px}

.pq-card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:box-shadow .12s,transform .12s;text-align:left;width:100%}
.pq-card:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.pq-card:focus-visible{outline:3px solid rgba(40,168,232,.45);outline-offset:1px}
.pq-card.sit-atrasado{border-left-color:var(--danger)}
.pq-card.sit-atencao{border-left-color:var(--gold)}
.pq-card.sit-emdia{border-left-color:var(--ok)}
.pq-topo{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pq-topo .ref-code{font-size:10.5px}
.pq-tipo{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pq-titulo{font-size:12.5px;font-weight:600;color:var(--navy);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pq-meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pq-meta .ico{font-size:14px}
.pq-sub{font-size:10.5px;font-weight:600;color:var(--txt2);background:var(--bg);border-radius:6px;padding:2px 7px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pq-sit{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.pq-sit .ponto{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pq-prog{height:4px;background:var(--bg2);border-radius:3px;overflow:hidden}
.pq-prog > div{height:100%;background:var(--teal-dark)}
.sit-cor-atrasado{color:var(--danger)} .sit-ponto-atrasado{background:var(--danger)}
.sit-cor-atencao{color:#B45309} .sit-ponto-atencao{background:var(--gold)}
.sit-cor-emdia{color:#047857} .sit-ponto-emdia{background:var(--ok)}

@media (max-width:1280px){
  .quadro{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:900px){
  .painel-ola{font-size:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 14px}
  .kpi .k-val{font-size:22px}
  .quadro{grid-template-columns:1fr;gap:8px}
  .fase > summary{min-height:48px}
  .fase > summary .f-seta{display:inline-flex;color:var(--muted);transition:transform .15s}
  .fase[open] > summary .f-seta{transform:rotate(180deg)}
  .aguardo-item{padding:12px 14px;gap:12px}
  .aguardo-txt b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .quadro-barra .busca{max-width:none}
}
</style>

<script>
// ═══════════════════════ PAINEL ═══════════════════════
// Um olhar sobre tudo: o que aguarda quem está logado, os números do
// portfólio e o quadro por fase (colunas no computador, lista agrupada no
// celular). Os dados vêm prontos de apiPainel (Kanban.gs); a tela abre na
// hora com a última versão guardada no navegador e se atualiza por baixo.

ROTAS['painel'] = carregarPainel;

let PAINEL = null;
let PAINEL_BUSCA = '';
let PAINEL_SIT = '';          // '', 'atrasado', 'atencao'
let PAINEL_VER_TODAS = false; // lista "aguardando você" expandida

async function carregarPainel(){
  if(!PAINEL) PAINEL = memoTela_('painel');
  const tinha = !!PAINEL;
  if(tinha) renderPainel(); else skeleton('lista');
  try{
    const frescos = await gs('apiPainel', TOKEN);
    const mudou = JSON.stringify(frescos) !== JSON.stringify(PAINEL);
    PAINEL = frescos;
    memoTela_('painel', frescos);
    atualizarContadoresMenu_(frescos.aguardando);
    if(NAV_ATIVO==='painel' && (!tinha || mudou)) renderPainel();
  }catch(e){ if(!tratarErroSessao(e) && !tinha) toast(e.message); }
}

// Números ao lado dos itens do menu = o que aguarda o usuário em cada tela.
function atualizarContadoresMenu_(aguardando){
  const por = {};
  const telaMenu = {pedido:'pedidos', medicao:'pagamentos', restricao:'lookahead', area:'areas', cronograma:'obras', manifestacao:'obras', assinatura:'encerramento'};
  (aguardando||[]).forEach(a=>{ const t = telaMenu[a.tipo]; if(t) por[t] = (por[t]||0) + 1; });
  ['pedidos','pagamentos','lookahead','areas','obras','encerramento'].forEach(t=>contadorMenu_(t, por[t]||0));
}

const AGUARDO_META = {
  pedido:       {ico:'forum',            cor:'var(--info)',      bg:'var(--info-bg)'},
  cronograma:   {ico:'timeline',         cor:'#1E40AF',          bg:'var(--info-bg)'},
  medicao:      {ico:'payments',         cor:'#047857',          bg:'var(--ok-bg)'},
  area:         {ico:'share_location',   cor:'#6D28D9',          bg:'#F1EFFC'},
  restricao:    {ico:'warning',          cor:'#B45309',          bg:'var(--gold-bg)'},
  manifestacao: {ico:'campaign',         cor:'#B45309',          bg:'var(--gold-bg)'},
  assinatura:   {ico:'draw',             cor:'var(--teal-dark)', bg:'var(--teal-lt)'}
};

function abrirPendencia_(tela, id){
  if(tela==='pedido') abrirDetalhePedido(id);
  else if(tela==='cronograma') abrirCronograma(id);
  else if(tela==='pagamentos') abrirPagamentosObra(id);
  else if(tela==='obra') abrirDetalhe(id);
  else if(tela==='encerramento') abrirEncerramentoObra(id);
  else navTo(tela);
}

function dataCurta_(iso){
  if(!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  return p.length===3 ? p[2]+'/'+p[1] : iso;
}

function htmlAguardando_(lista){
  if(!lista.length){
    return `<div class="aguardo"><div class="aguardo-vazio"><span class="ico ico-fill">task_alt</span><div><b style="color:var(--navy)">Nada aguardando você agora.</b><div style="color:var(--muted);font-size:12.5px">Quando algo depender da sua decisão, aparece aqui.</div></div></div></div>`;
  }
  const LIMITE = 6;
  const visiveis = PAINEL_VER_TODAS ? lista : lista.slice(0, LIMITE);
  const hoje = PAINEL.hoje;
  return `<div class="aguardo">${visiveis.map(a=>{
    const m = AGUARDO_META[a.tipo] || {ico:'radio_button_unchecked', cor:'var(--muted)', bg:'var(--bg2)'};
    const vencido = a.quando && a.quando < hoje && (a.tipo==='restricao' || a.tipo==='manifestacao');
    return `<div class="aguardo-item" role="button" tabindex="0" onclick="abrirPendencia_('${esc(a.tela)}','${esc(a.id)}')" onkeydown="if(event.key==='Enter')this.click()">
      <span class="aguardo-ico" style="background:${m.bg};color:${m.cor}"><span class="ico">${m.ico}</span></span>
      <span class="aguardo-txt"><b>${esc(a.titulo)}</b><small>${esc(a.detalhe||'')}</small></span>
      ${a.quando?`<span class="aguardo-quando${vencido?' vencido':''}">${vencido?'venceu ':''}${esc(dataCurta_(a.quando))}</span>`:''}
      <span class="ico" style="color:var(--muted)">chevron_right</span>
    </div>`;
  }).join('')}
  ${lista.length > LIMITE ? `<button class="aguardo-mais" onclick="PAINEL_VER_TODAS=!PAINEL_VER_TODAS;renderPainel()">${PAINEL_VER_TODAS?'Mostrar menos':'Ver todas ('+lista.length+')'}</button>` : ''}
  </div>`;
}

function moedaCurta_(v){
  const n = Number(v)||0;
  if(n >= 1e6) return 'R$ ' + (n/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi';
  if(n >= 1e3) return 'R$ ' + (n/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mil';
  return 'R$ ' + n.toLocaleString('pt-BR',{maximumFractionDigits:2});
}

function htmlKpis_(ind){
  const k = (rot, val, sub, classe, acao) => `<${acao?'button':'div'} class="kpi ${classe||''}" ${acao?'onclick="'+acao+'"':''}>
    <span class="k-rot">${rot}</span><span class="k-val">${val}</span><span class="k-sub">${sub}</span></${acao?'button':'div'}>`;
  const ppc = ind.ppcSemana;
  return `<div class="kpis">
    ${k('Pedidos abertos', ind.pedidosAbertos, 'aguardando decisão', ind.pedidosAbertos?'atencao':'', pode('pedidos.ler')?"navTo('pedidos')":'')}
    ${k('Projetos ativos', ind.projetosAtivos, 'do pedido à execução', '', '')}
    ${k('Atrasados', ind.atrasados, ind.atencao ? ind.atencao+' em atenção' : 'atividades vencidas', ind.atrasados?'alerta':'bom', "filtrarSituacao_('atrasado')")}
    ${k('PPC da semana', ppc==null?'—':ppc+'%', 'compromissos cumpridos', ppc==null?'':(ppc>=80?'bom':(ppc>=60?'atencao':'alerta')), pode('execucao.ler')?"navTo('compromisso')":'')}
    ${k('Restrições abertas', ind.restricoesAbertas, 'impedimentos a remover', ind.restricoesAbertas?'atencao':'bom', pode('execucao.ler')?"navTo('lookahead')":'')}
    ${k('Medido aprovado', moedaCurta_(ind.valorMedidoAprovado), ind.valorMedidoPendente ? moedaCurta_(ind.valorMedidoPendente)+' a conferir' : 'nada a conferir', '', pode('medicoes.ler')?"navTo('pagamentos')":'')}
  </div>`;
}

function filtrarSituacao_(sit){
  PAINEL_SIT = PAINEL_SIT===sit ? '' : sit;
  renderPainel();
  const q = document.querySelector('.quadro-barra');
  if(q) q.scrollIntoView({behavior:'smooth', block:'start'});
}

const SIT_ROTULO = {atrasado:'Atrasado', atencao:'Atenção', emdia:'Em dia'};

function htmlCardQuadro_(it){
  const abrir = it.tipo==='pedido' ? `abrirDetalhePedido('${esc(it.ID)}')` : `abrirDetalhe('${esc(it.ID)}')`;
  return `<button class="pq-card sit-${it.situacao}" onclick="${abrir}">
    <span class="pq-topo"><span class="ref-code">${esc(it.ID)}</span></span>
    <span class="pq-titulo">${esc(it.Titulo||'—')}</span>
    ${it.subfase?`<span class="pq-sub">${esc(it.subfase)}</span>`:''}
    ${it.local||it.responsavel?`<span class="pq-meta"><span class="ico">place</span>${esc(it.local||'—')}${it.responsavel?' · '+esc(it.responsavel):''}</span>`:''}
    ${it.proximaData?`<span class="pq-meta"><span class="ico">event</span>${esc(it.rotuloData||'')} ${esc(dataCurta_(it.proximaData))}</span>`:''}
    ${it.progresso!=null?`<span class="pq-prog" title="${it.progresso}% dos pacotes concluídos"><div style="width:${it.progresso}%"></div></span>`:''}
    <span class="pq-sit sit-cor-${it.situacao}"><span class="ponto sit-ponto-${it.situacao}"></span>${SIT_ROTULO[it.situacao]}${it.motivo?' · '+esc(it.motivo):''}</span>
  </button>`;
}

function itensFiltrados_(){
  const q = PAINEL_BUSCA.trim().toLowerCase();
  return PAINEL.itens.filter(it=>
    (!PAINEL_SIT || it.situacao===PAINEL_SIT) &&
    (!q || (it.ID+' '+it.Titulo+' '+it.local+' '+it.responsavel).toLowerCase().indexOf(q)>=0));
}

function htmlQuadro_(){
  const itens = itensFiltrados_();
  const celular = window.matchMedia('(max-width:900px)').matches;
  const colunas = PAINEL.fases.map((fase,i)=>{
    const daFase = itens.filter(it=>it.bucket===fase);
    const aberto = !celular || daFase.length > 0;
    return `<details class="fase" ${aberto?'open':''} data-fase="${esc(fase)}">
      <summary><span class="f-nome"><span class="f-num">${i+1}</span>${esc(fase)}</span><span style="display:flex;align-items:center;gap:6px"><span class="f-qtd">${daFase.length}</span><span class="ico f-seta">expand_more</span></span></summary>
      <div class="fase-corpo">${daFase.length ? daFase.map(htmlCardQuadro_).join('') : '<div class="fase-vazia">Nada nesta fase</div>'}</div>
    </details>`;
  }).join('');
  const paralelos = itens.filter(it=>it.bucket==='Cancelado' || it.bucket==='Recusado');
  return `<div class="quadro">${colunas}</div>
    ${paralelos.length?`<details class="fase" style="margin-top:12px"><summary><span class="f-nome"><span class="ico" style="font-size:17px">block</span>Cancelados e recusados</span><span class="f-qtd">${paralelos.length}</span></summary>
      <div class="fase-corpo" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">${paralelos.map(htmlCardQuadro_).join('')}</div></details>`:''}`;
}

function renderPainel(){
  if(!PAINEL) return;
  const primeiro = String(NOME||'').trim().split(/\s+/)[0] || '';
  const hora = new Date().getHours();
  const saudacao = hora < 12 ? 'Bom dia' : (hora < 18 ? 'Boa tarde' : 'Boa noite');
  const dataBruta = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
  const dataLonga = dataBruta.charAt(0).toUpperCase() + dataBruta.slice(1);
  const nFiltro = itensFiltrados_().length;
  const h = `<div class="pg-header">
      <div><div class="painel-data">${esc(dataLonga)}</div>
      <div class="painel-ola">${saudacao}${primeiro?', '+esc(primeiro):''}</div>
      <p class="ph-desc">O que depende de você e como está cada pedido e projeto.</p></div>
    </div>
    <section class="painel-secao">
      <h3><span class="ico" style="color:var(--gold)">notifications_active</span>Aguardando você${PAINEL.aguardando.length?'<span class="qtd">'+PAINEL.aguardando.length+'</span>':''}</h3>
      ${htmlAguardando_(PAINEL.aguardando)}
    </section>
    ${htmlKpis_(PAINEL.indicadores)}
    <section class="painel-secao">
      <h3><span class="ico" style="color:var(--teal-dark)">view_kanban</span>Pedidos e projetos por fase</h3>
      <div class="quadro-barra">
        <label class="busca"><span class="ico" style="color:var(--muted)">search</span><input type="text" id="painelBusca" placeholder="Buscar por nome, código ou local" value="${esc(PAINEL_BUSCA)}" oninput="PAINEL_BUSCA=this.value;atualizarQuadro_()" aria-label="Buscar no quadro"></label>
        <div class="filtro-sit" role="group" aria-label="Filtrar por situação">
          ${[['','Todos',''],['atrasado','Atrasados','var(--danger)'],['atencao','Atenção','var(--gold)']].map(([v,r,c])=>
            `<button class="${PAINEL_SIT===v?'ativo':''}" onclick="PAINEL_SIT='${v}';renderPainel()">${c?'<span class="ponto" style="background:'+c+'"></span>':''}${r}</button>`).join('')}
        </div>
        <span id="painelContagem" style="font-size:12px;color:var(--muted);margin-left:auto">${nFiltro} item(ns)</span>
      </div>
      <div id="painelQuadro">${htmlQuadro_()}</div>
    </section>`;
  renderShell('painel', h, true);
}

// Busca redesenha só o quadro (o campo não perde o foco).
function atualizarQuadro_(){
  const q = $('painelQuadro'); if(q) q.innerHTML = htmlQuadro_();
  const c = $('painelContagem'); if(c) c.textContent = itensFiltrados_().length + ' item(ns)';
}
</script>

<script>
// ═══════════════════════════ CASCA (shell admin) ═══════════════════════════
// Visual do sistema de eventos: barra lateral com a marca no topo e o menu
// na ordem do trabalho (Pedidos → … → Encerramento). No celular vira
// gaveta, aberta pelo botão da barra compacta.
//
// ROTAS é um registro preenchido pelos módulos de tela: cada módulo
// registra ROTAS['pedidos'] = suaFuncaoDeCarregar. Só aparece no menu o
// que já tem tela (ROTAS) e o que o perfil logado pode abrir (`perm`).
const ROTAS = {};

// `perm` = permissão exigida ("módulo.ação", ver MODULOS em Permissoes.gs;
// 'PMO' = exclusivo do PMO). A proteção de verdade é sempre do servidor.
const SIDEBAR_SECOES = [
  {titulo:'Visão geral', itens:[
    {id:'painel', ico:'space_dashboard', label:'Painel', sub:'tudo em um olhar', perm:'painel.ler'},
    {id:'minhasatividades', ico:'construction', label:'Minhas atividades', sub:'meus pacotes de trabalho', perm:'minhas.editar', soResponsavel:true}
  ]},
  {titulo:'Ciclo do projeto', itens:[
    {id:'pedidos', ico:'forum', label:'Pedidos', sub:'entrada e aprovação', perm:'pedidos.ler'},
    {id:'obras', ico:'domain', label:'Projetos', sub:'obras e projetos', perm:'projetos.ler'},
    {id:'areas', ico:'share_location', label:'Áreas e impactos', sub:'áreas propostas', perm:'areas.ler'},
    {id:'cronogramapmo', ico:'timeline', label:'Cronograma', sub:'visão rápida', perm:'cronograma.ler'},
    {id:'lookahead', ico:'calendar_view_week', label:'Lookahead', sub:'antecipar impedimentos', perm:'execucao.ler'},
    {id:'compromisso', ico:'fact_check', label:'Compromisso semanal', sub:'atividades · PPC', perm:'execucao.ler'},
    {id:'pagamentos', ico:'payments', label:'Medições', sub:'pagamentos · curva S', perm:'medicoes.ler'},
    {id:'encerramento', ico:'verified', label:'Encerramento', sub:'aceite e relatórios', perm:'encerramento.ler'}
  ]},
  {titulo:'Administração', itens:[
    {id:'configuracoes', ico:'admin_panel_settings', label:'Configurações', sub:'usuários · permissões', perm:'PMO'}
  ]}
];

let NAV_ATIVO = 'painel';

function navTo(id){
  NAV_ATIVO = id;
  fecharMenu_();
  const rota = ROTAS[id];
  if (rota) { rota(); } else { renderEmBreve(id); }
}

function itemNav_(id){
  for (const sec of SIDEBAR_SECOES) {
    const it = sec.itens.find(i=>i.id===id);
    if (it) return it;
  }
  return null;
}

// Aparece no menu: tem tela pronta e o perfil pode abrir. "Minhas
// atividades" fica só para quem não tem o Painel (o responsável de campo).
function itemVisivel_(i){
  if (!ROTAS[i.id]) return false;
  if (i.soResponsavel && pode('painel.ler')) return false;
  return i.perm === 'PMO' ? PAPEL === 'PMO' : pode(i.perm);
}

function papelBadge(){
  const cor = PAPEL==='PMO' ? ['var(--info-bg)','#1E40AF','verified'] : ['rgba(255,255,255,.12)','#fff','badge'];
  return `<span class="pill" style="background:${cor[0]};color:${cor[1]}"><span class="ico" style="font-size:14px">${cor[2]}</span>${esc(PAPEL==='Responsavel'?'Responsável':PAPEL)}</span>`;
}

// Casca PERSISTENTE: barra lateral montada UMA vez; navegar só troca o
// conteúdo (#shellConteudo) e a marcação do item ativo — sem reconstruir o
// menu, sem recarregar a logo, sem tremor de tela.
function montarShell_(){
  const el=document.getElementById('app');
  if(el.classList.contains('shell-mode') && $('shellConteudo')) return; // já montada
  const secoes = SIDEBAR_SECOES.map(sec=>{
    const itens = sec.itens.filter(itemVisivel_);
    if(!itens.length) return '';
    const links = itens.map(i=>{
      const label='<span class="nav-label">'+esc(i.label)+(i.sub?'<span class="nav-sub">'+esc(i.sub)+'</span>':'')+'</span>';
      return `<a id="nav-${i.id}" href="#" title="${esc(i.label)}" onclick="navTo('${i.id}');return false"><span class="ico">${i.ico}</span>${label}<span class="nav-cont" id="cont-${i.id}" hidden></span></a>`;
    }).join('');
    return `<div class="sb-section"><div class="sb-section-titulo">${esc(sec.titulo)}</div><nav>${links}</nav></div>`;
  }).join('');

  el.innerHTML=`<header class="app-mobilebar">
    <button class="mb-botao" onclick="abrirMenu_()" aria-label="Abrir menu" aria-controls="menuLateral"><span class="ico">menu</span></button>
    <div class="mb-titulo"><span>Projetos e Obras · PMO</span><b id="mbTitulo">Painel</b></div>
    <span class="mb-av" title="${esc(NOME)}">${esc(iniciaisNome_(NOME))}</span>
  </header>
  <div class="sb-fundo" onclick="fecharMenu_()"></div>
  <aside class="app-sidebar" id="menuLateral" aria-label="Menu principal">
    <div class="sb-marca">
      <button class="sb-toggle" id="sbToggle" title="Recolher/expandir menu" aria-label="Recolher ou expandir o menu" onclick="alternarSidebar_()"><span class="ico">chevron_left</span></button>
      <span class="sb-marca-logo"><img src="${LOGO_HB}" alt="Hospital da Baleia"></span>
      <span class="sb-marca-txt"><b>Projetos e Obras</b><span>PMO · Hospital da Baleia</span></span>
    </div>
    <div class="sb-nav-scroll">${secoes}</div>
    <div class="sb-footer">
      <div class="sb-user"><span class="ico" style="font-size:18px">account_circle</span><span class="sb-user-nome">${esc(NOME)}<span class="sb-user-cargo">${esc(CARGO||'')}</span></span>${papelBadge()}</div>
      <div class="sb-acoes">
        <button class="btn btn-ghost" title="Trocar minha senha" onclick="abrirTrocarSenha()"><span class="ico" style="font-size:15px">key</span><span class="nav-label">Minha senha</span></button>
        <button class="btn btn-ghost" title="Sair" onclick="fazerLogout()"><span class="ico" style="font-size:15px">logout</span><span class="nav-label">Sair</span></button>
      </div>
    </div>
  </aside>
  <main class="shell-main" id="shellMain"><div class="shell-inner" id="shellConteudo"></div></main>`;
  el.classList.add('shell-mode');
  el.classList.remove('wrap-wide');
  if(localStorage.getItem('obrasHbSidebarColapsada')==='1'){
    el.classList.add('sidebar-colapsada');
    const btn=$('sbToggle'); if(btn) btn.querySelector('.ico').textContent='chevron_right';
  }
}

function iniciaisNome_(nome){
  const p = String(nome||'').trim().split(/\s+/);
  return ((p[0]||' ')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();
}

// Gaveta do celular
function abrirMenu_(){
  const el = document.getElementById('app');
  el.classList.add('menu-aberto');
  const ativo = document.querySelector('.app-sidebar nav a.active') || document.querySelector('.app-sidebar nav a');
  if(ativo) setTimeout(()=>ativo.focus(), 50);
}
function fecharMenu_(){
  const el = document.getElementById('app');
  if(el) el.classList.remove('menu-aberto');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharMenu_(); });

// Número ao lado de um item do menu (ex.: pedidos aguardando aprovação).
function contadorMenu_(id, n){
  const c = $('cont-'+id);
  if(!c) return;
  c.textContent = n > 99 ? '99+' : String(n||'');
  c.hidden = !n;
}

// Recolher/expandir a barra (só ícones vs. ícones+texto) — preferência
// persistida em localStorage, sobrevive a navegação e a novas sessões.
function alternarSidebar_(){
  const el=document.getElementById('app');
  const colapsada = el.classList.toggle('sidebar-colapsada');
  localStorage.setItem('obrasHbSidebarColapsada', colapsada?'1':'0');
  const btn=$('sbToggle');
  if(btn) btn.querySelector('.ico').textContent = colapsada?'chevron_right':'chevron_left';
}

// SHELL_TELA_ATUAL rastreia a última tela de fato renderizada — a
// atualização de fundo (stale-while-revalidate) chama renderShell de novo
// pra MESMA tela quando os dados mudam, e isso não é uma navegação: só
// re-anima + zera o scroll quando activeNav muda de verdade, senão a
// tela "pula" sozinha a cada refresh silencioso (2min de cache).
let SHELL_TELA_ATUAL = null;
function renderShell(activeNav, innerHtml, wide){
  const navegou = activeNav !== SHELL_TELA_ATUAL;
  NAV_ATIVO = activeNav;
  SHELL_TELA_ATUAL = activeNav;
  montarShell_();
  document.querySelectorAll('.app-sidebar nav a').forEach(a=>a.classList.remove('active'));
  const ativo=$('nav-'+activeNav); if(ativo)ativo.classList.add('active');
  const it = itemNav_(activeNav); const mb = $('mbTitulo'); if(mb) mb.textContent = it ? it.label : 'Projetos e Obras';
  $('shellMain').classList.toggle('shell-wide',!!wide);
  const c=$('shellConteudo');
  c.innerHTML=innerHtml;
  if(navegou){
    c.classList.remove('view-enter');void c.offsetWidth;c.classList.add('view-enter');
    window.scrollTo(0,0);
  }
}

function shellHero(crumbRoot,crumbRootOnclick,crumbAtual,titulo,actionsHtml){
  return `<div class="shell-hero">
    <nav class="shell-hero-crumb"><a href="#" onclick="${crumbRootOnclick};return false">${crumbRoot}</a><span class="ico">chevron_right</span><span class="current">${crumbAtual}</span></nav>
    <div class="shell-hero-row">
      <h1>${titulo}</h1>
      ${actionsHtml?'<div class="shell-hero-actions">'+actionsHtml+'</div>':''}
    </div>
  </div>`;
}

// Tela-padrão para itens de menu cuja fase de construção ainda não chegou.
function renderEmBreve(id){
  const it = itemNav_(id) || {ico:'construction', label:'Em construção', desc:''};
  const h = `<div class="topbar">
    <div><div class="eyebrow">Hospital da Baleia · Engenharia e PMO</div><h1 style="font-size:22px">${esc(it.label)}${it.sub?' <span style="font-weight:500;font-size:12px;color:var(--muted)">· '+esc(it.sub)+'</span>':''}</h1></div>
  </div>
  <div class="card" style="text-align:center;padding:48px"><span class="ico" style="font-size:46px;color:#CBD5E1">${it.ico}</span>
    <h2 style="justify-content:center;margin-top:10px">Em breve</h2>
    <p style="color:var(--muted);max-width:460px;margin:6px auto 0">${esc(it.desc||'Esta tela será ativada numa fase seguinte da construção do novo sistema.')}</p></div>`;
  renderShell(id, h);
}

// Home após o login: o Painel, ou a primeira tela que o perfil pode abrir
// (o Responsável de campo cai direto em "Minhas Atividades").
function renderHome(){
  for (const sec of SIDEBAR_SECOES) {
    const it = sec.itens.find(itemVisivel_);
    if (it) { navTo(it.id); return; }
  }
  renderShell('', '<div class="card" style="text-align:center;padding:48px"><span class="ico" style="font-size:46px;color:#CBD5E1">lock</span>'
    + '<h2 style="justify-content:center;margin-top:10px">Seu perfil ainda não tem telas liberadas</h2>'
    + '<p style="color:var(--muted)">Peça ao PMO para ajustar as permissões do perfil ' + esc(PAPEL) + '.</p></div>');
}
</script>
